name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all-features

      - name: Build release
        # --locked mirrors the release job: it fails if Cargo.lock is out of
        # sync with Cargo.toml, which is easy to do when bumping the version.
        run: cargo build --release --locked

  shellcheck:
    name: Shell script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck install.sh
        run: shellcheck -s sh install.sh

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Dependabot pull requests run with a read-only token, so audit-check cannot
    # report and the check would sit pending forever. Their dependency changes
    # are audited on main straight after the merge.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
