name: Release

# Publishes a release whenever the version in Cargo.toml changes on main.
# Bumping the version is the entire release ritual - no tags to push by hand.
on:
  push:
    branches: [main]
    paths: ['Cargo.toml']
  workflow_dispatch:
    inputs:
      force:
        description: Release even if the tag already exists
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  gate:
    name: Has the version changed?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: check
        run: |
          version="$(grep -m1 '^version *=' Cargo.toml | cut -d'"' -f2)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version: $version"

          if git rev-parse "v$version" >/dev/null 2>&1; then
            if [ "${{ inputs.force }}" = "true" ]; then
              echo "Tag v$version exists, but force was requested."
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "Tag v$version already exists; nothing to release."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No tag for v$version yet - releasing."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build and publish
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags and full history are needed to work out what changed since the
          # previous release; a shallow clone silently produces "First release".
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          name="keyboard-screen-v${VERSION}-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/release/keyboard-screen "dist/$name/"
          cp README.md LICENSE install.sh "dist/$name/"
          cp -r udev systemd "dist/$name/"
          tar -czf "dist/${name}.tar.gz" -C dist "$name"
          cp target/release/keyboard-screen "dist/keyboard-screen-linux-x86_64"
          cd dist && sha256sum ./*.tar.gz keyboard-screen-linux-x86_64 > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: |
          {
            echo "## Install"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sh"
            echo '```'
            echo

            # Prefer the hand-written changelog entry for this version; fall
            # back to the commit log when there is not one.
            notes="$(awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" {inside=1; next}
              inside && /^## \[/ {exit}
              inside {print}
            ' CHANGELOG.md | sed '/^$/{ N; /^\n$/D; }')"

            if [ -n "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
              echo "## What changed"
              printf '%s\n' "$notes"
            else
              prev="$(git tag --sort=-v:refname | grep -v "^v${VERSION}$" | head -n1)"
              if [ -n "$prev" ]; then
                echo "## Changes since ${prev}"
                echo
                git log --no-merges --pretty='- %s' "${prev}..HEAD"
              else
                echo "First release."
              fi
            fi
            echo
            echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md"
            echo
            echo "Verify a download against \`SHA256SUMS\`."
          } > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f "v${VERSION}"
          git push -f origin "v${VERSION}"
          gh release delete "v${VERSION}" --yes 2>/dev/null || true
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file notes.md \
            dist/*.tar.gz dist/keyboard-screen-linux-x86_64 dist/SHA256SUMS
