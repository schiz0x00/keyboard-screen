[package]
name = "keyboard-screen"
version = "0.2.1"
edition = "2021"
description = "Claude usage limits on the Epomaker x Aula F75 Max 128x128 keyboard screen"
license = "MIT"
repository = "https://github.com/schiz0x00/keyboard-screen"
readme = "README.md"
keywords = ["keyboard", "hid", "claude", "aula", "epomaker"]
categories = ["command-line-utilities"]
rust-version = "1.85"

[dependencies]
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
